name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  #################################################
  # BACKEND TESTS
  #################################################

  backend-tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/pipes-bakery-backend

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

  #################################################
  # FRONTEND TESTS
  #################################################

  frontend-tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/pipes-bakery-frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/pipes-bakery-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

      - name: Lint code
        run: npm run lint

      - name: Build frontend
        run: npm run build

  #################################################
  # BUILD + PUSH BACKEND IMAGE
  #################################################

  docker-backend-build:

    runs-on: ubuntu-latest

    needs:
      - backend-tests

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      #################################################
      # LOGIN GHCR
      #################################################

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.AUTH_TOKEN }}

      #################################################
      # BACKEND IMAGE
      #################################################

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/pipes-bakery-backend
          push: true
          tags: |
            ghcr.io/byimthejuan/pipes-bakery-backend:latest
            ghcr.io/byimthejuan/pipes-bakery-backend:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  #################################################
  # BUILD + PUSH FRONTEND IMAGE
  #################################################

  docker-frontend-build:

    runs-on: ubuntu-latest

    needs:
      - frontend-tests

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      #################################################
      # LOGIN GHCR
      #################################################

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.AUTH_TOKEN }}

      #################################################
      # FRONTEND IMAGE
      #################################################

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/pipes-bakery-frontend
          push: true
          tags: |
            ghcr.io/byimthejuan/pipes-bakery-frontend:latest
            ghcr.io/byimthejuan/pipes-bakery-frontend:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max