server {
    listen 80;

    # Product image uploads (backend allows up to 5MB per image)
    client_max_body_size 6M;

    # Compress text responses (images are already compressed)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ASSETS (JS y CSS): file names carry a content hash, so they never change
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # FRONTEND images: not hashed, rename the file when its content changes
    location /images/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # BACKEND images
    location /api/images/ {
        proxy_pass http://backend:8080/images/;
    }

    # BACKEND API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace client-provided forwarding data; the backend rate limit trusts this hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FRONTEND (SPA): index.html is revalidated on every visit so deploys show up at once
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
