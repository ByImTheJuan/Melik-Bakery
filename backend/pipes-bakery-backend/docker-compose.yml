version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: pipes-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pipes_bakery
      MYSQL_USER: pipes_user
      MYSQL_PASSWORD: pipes_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pipes-network

  redis:
    image: redis:7
    container_name: pipes-redis
    ports:
      - "6379:6379"
    networks:
      - pipes-network

networks:
  pipes-network:

volumes:
  mysql-data: