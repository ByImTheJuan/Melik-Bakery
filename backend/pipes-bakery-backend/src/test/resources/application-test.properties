spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#spring.profiles.active=test

spring.sql.init.mode=never
spring.flyway.enabled=false
logging.level.org.springframework=DEBUG

application.security.jwt.secret=this-is-a-very-long-test-secret-key-with-at-least-32-bytes
application.security.jwt.expiration=1h

application.payments.wompi.public-key=pub_test_dummy
application.payments.wompi.integrity-secret=test_integrity_dummy
application.payments.wompi.events-secret=test_events_dummy
application.payments.wompi.api-base-url=https://sandbox.wompi.co/v1
application.payments.wompi.checkout-base-url=https://checkout.wompi.co/p/
application.payments.wompi.redirect-url=http://localhost:5173/payment/pending
