spring.application.name=pipes-bakery-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pipes_bakery}
spring.datasource.username=${DB_USER:pipes_user}
spring.datasource.password=${DB_PASSWORD:pipes_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Solo para desarrollo, en producción se debe usar "validate" o "none"
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.properties.hibernate.hbm2ddl.auto=create
#spring.jpa.properties.hibernate.hbm2ddl.schema-generation.scripts.action=create
#spring.jpa.properties.hibernate.hbm2ddl.schema-generation.scripts.create-target=./src/main/resources/schema.sql

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=60000
spring.data.redis.timeout=60000

spring.web.resources.add-mappings=true

application.security.jwt.secret=${JWT_SECRET:melik-bakery-development-secret-key-change-me-please}
application.security.jwt.expiration=${JWT_EXPIRATION:1h}

