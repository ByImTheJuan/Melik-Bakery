spring.application.name=pipes-bakery-backend

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# IMAGES
# Directory where product images are stored (uploads are written here) and served from.
# Override per environment in the profile file or with the APP_IMAGES_PATH environment variable.
app.images.path=${APP_IMAGES_PATH:/app/images}
app.images.url-pattern=/images/**

# IMAGE UPLOADS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# EMAIL
# provider: "log" writes emails to the console (default), "resend" sends them through Resend.
application.email.provider=${EMAIL_PROVIDER:resend}
application.email.from=${EMAIL_FROM:Melik Bakery <no-reply@melikbakery.com>}
application.email.reply-to=${EMAIL_REPLY_TO:}
application.email.resend.api-key=${RESEND_API_KEY:}
application.email.resend.api-base-url=${RESEND_API_BASE_URL:https://api.resend.com}
# Templates are only used for emails, not for MVC views
spring.thymeleaf.check-template-location=false
