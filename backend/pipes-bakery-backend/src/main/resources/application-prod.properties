# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# REDIS
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.connect-timeout=5000
spring.data.redis.timeout=5000

#BACKEND IMAGES
spring.web.resources.add-mappings=true

# SECURITY
server.error.include-message=never
server.error.include-stacktrace=never

# HTTPS / proxy
server.forward-headers-strategy=framework

# LOGGING
logging.level.org.springframework=WARN
logging.level.com.hyd.pipes_bakery_backend=INFO

#JWT
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION}

#HIKARICP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

#SWAGGER
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration



# CRSF
app.security.csrf.enabled=true

# WOMPI
application.payments.wompi.public-key=${WOMPI_PUBLIC_KEY}
application.payments.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET}
application.payments.wompi.events-secret=${WOMPI_EVENTS_SECRET}
application.payments.wompi.api-base-url=${WOMPI_API_BASE_URL}
application.payments.wompi.checkout-base-url=${WOMPI_CHECKOUT_BASE_URL:https://checkout.wompi.co/p/}
application.payments.wompi.redirect-url=${WOMPI_REDIRECT_URL}
