# MYSQL LOCAL
spring.datasource.url=jdbc:mysql://localhost:3306/pipes_bakery
spring.datasource.username=pipes_user
spring.datasource.password=pipes_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LOGGING
logging.level.org.springframework=INFO
logging.level.com.hyd.pipes_bakery_backend=DEBUG

# REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379

# DEV ONLY
server.error.include-stacktrace=always

#JWT
application.security.jwt.secret=melik-bakery-development-secret-key-change-me-please
application.security.jwt.expiration=1h

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# IMAGES
app.images.path=C:/Users/jdher/OneDrive/Desktop/PipesBakery/data/products-images
app.images.url-pattern=/images/products/**

# CSRF
app.security.csrf.enabled=true

# WOMPI (sandbox)
application.payments.wompi.public-key=pub_test_REPLACE_ME
application.payments.wompi.integrity-secret=test_integrity_REPLACE_ME
application.payments.wompi.events-secret=test_events_REPLACE_ME
application.payments.wompi.api-base-url=https://sandbox.wompi.co/v1
application.payments.wompi.checkout-base-url=https://checkout.wompi.co/p/
application.payments.wompi.redirect-url=http://localhost:5173/payment/pending
