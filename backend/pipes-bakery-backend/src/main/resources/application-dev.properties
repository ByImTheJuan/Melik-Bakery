# MYSQL LOCAL
spring.datasource.url=jdbc:mysql://localhost:3306/pipes_bakery
spring.datasource.username=pipes_user
spring.datasource.password=pipes_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LOGGING
logging.level.org.springframework=INFO
logging.level.com.hyd.pipes_bakery_backend=DEBUG

# REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379

# DEV ONLY
server.error.include-stacktrace=always

#JWT
application.security.jwt.secret=melik-bakery-development-secret-key-change-me-please
application.security.jwt.expiration=1h

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# The local dev DB is shared across branches: don't fail on migrations applied
# from another branch (e.g. payments' V3/V4) that this checkout doesn't contain.
spring.flyway.ignore-migration-patterns=*:missing,*:future

# IMAGES
app.images.path=C:/Users/jdher/OneDrive/Desktop/PipesBakery/data/products-images

# CSRF
app.security.csrf.enabled=true

